  <body>
    <div class="window nav-window">
      <div class="inner-window">
        <div class="window-bar">
          <div class="window-title"><span>/home/mew151</span></div>
        </div>
        <div class="window-content">
          <nav class="explorer">
            <iframe
              title="Site Navigation"
              src="/nav-fallback.html"
              style="width: 100%; height: 100%"
            ></iframe>
          </nav>
        </div>
      </div>
    </div>
    <div class="window main-window">
      <div class="inner-window">
        <div class="window-bar">
          <div class="window-title"><span>/chipotle</span></div>
        </div>
        <div class="window-content">
          <main id="main" style="background: #fff; color: #000" class="light">
            <div style="text-align: center">
              <h1>/chipotle</h1>
            </div>
            <p>
              Here is my standard Chipotle order, conforming to the very
              official
              <a
                href="https://indieweb.org/Chipotle"
                data-gmi-footnote="Indieweb Wiki: Chipotle page specification"
                >chipotle page specification.</a
              >
            </p>
            <ul>
              <li>Burrito</li>
              <li>White Rice</li>
              <li>Pinto Beans</li>
              <li>Barbacoa</li>
              <li>Tomatillo Red-Chili Salsa</li>
              <li>Sour Cream</li>
              <li>Cheese</li>
            </ul>
          </main>
        </div>
      </div>
    </div>

          <div class="window-bar">

            <mew151-x-random tie-color="#ac2318"></mew151-x-random>
          </div>
        </div>
      </div>
      <script type="text/javascript">
        window.unixMessages = {
          catclock: ["Don't forget the Mexican Coca-Cola!"],
          xeyes: [
            "Double wrap it if you're feeling brave and want to be in a food coma.",
          ],
          biblical: ["CHIPS ON SIDE IF ORDERING WITH OTHERS"],
          cowsay: [
            "Pronouncing Chipotle like Aristotle. And Aristotle like Chipotle.",
          ],
        };
      </script>
    </div>
